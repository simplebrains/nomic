name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: machine (cargo test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - run: cargo test --locked
      - name: models, fixtures, citations
        run: |
          for m in examples/*/*.nom; do ./target/release/nomic check "$m"; done
          ./target/release/nomic fmt --check examples/*/*.nom
          ./target/release/nomic cite examples/nomic/nomic.nom

  packages:
    name: editor packages (pnpm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r run build
      - run: pnpm -r run test
