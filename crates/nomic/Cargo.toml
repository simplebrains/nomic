[package]
name = "nomic"
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["specification", "modeling", "rules", "verification", "dsl"]
categories = ["compilers", "development-tools"]
description = "Nomic Core 0.1 reference machine: a deterministic executable specification language"

[lib]
name = "nomic"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
