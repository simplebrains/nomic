[package]
name = "nomic-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["specification", "modeling", "rules", "verification", "dsl"]
categories = ["compilers", "development-tools"]
description = "The `nomic` command line: check, run, explore, cite, and format Nomic models"

[[bin]]
name = "nomic"
path = "src/main.rs"

[dependencies]
nomic = { path = "../nomic", version = "0.1.0" }
nomic-fmt = { path = "../nomic-fmt", version = "0.1.0" }
serde_json = "1"
